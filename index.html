<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Progress Hafalan Juz 30</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Firebase SDK v9 compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="container">
    <div class="header-title">
      Progress Hafalan Juz 30
    </div>
    <section>
      <h2>Progress Global Seluruh Siswa</h2>
      <div id="global-progress-container">
        <div class="progress-bar-container" style="height:22px;">
          <div class="progress-bar" id="global-progress-bar" style="height:22px;font-size:15px;"></div>
        </div>
        <div id="global-progress-label" style="margin-top:4px;font-size:16px;font-weight:bold;color:#2d6cdf;"></div>
      </div>
    </section>
    <section>
      <div id="predikat-container" style="margin:10px 0 18px 0;"></div>
    </section>
    <section>
      <button id="open-form-siswa" type="button" class="btn-primary">+ Tambah Siswa</button>
      <div id="modal-siswa" class="modal-bg">
        <div class="modal-content">
          <h2>Tambah Siswa</h2>
          <form id="form-siswa">
            <input type="text" id="nama" placeholder="Nama Siswa" required>
            <select id="kelas" required>
              <option value="">Pilih Kelas</option>
              <option value="1A">1A</option>
              <option value="1B">1B</option>
              <option value="2A">2A</option>
              <option value="2B">2B</option>
              <option value="3A">3A</option>
              <option value="3B">3B</option>
              <option value="4A">4A</option>
              <option value="4B">4B</option>
              <option value="5A">5A</option>
              <option value="5B">5B</option>
              <option value="6A">6A</option>
              <option value="6B">6B</option>
            </select>
            <div style="display:flex;gap:8px;">
              <button type="submit">Tambah</button>
              <button type="button" id="close-form-siswa" class="btn-batal">Batal</button>
            </div>
          </form>
          <div id="daftar-siswa"></div>
        </div>
      </div>
    </section>
    <section>
      <h2>Input Setoran Hafalan</h2>
      <form id="form-setoran">
        <select id="siswa" required></select>
        <input type="date" id="tanggal" required>
        <select id="surat" required>
          <option value="">Pilih Surat</option>
        </select>
        <select id="dari-ayat" required></select>
        <select id="sampai-ayat" required></select>
        <select id="status" required>
          <option value="">Status</option>
          <option value="lancar">Lancar</option>
          <option value="perlu perbaikan">Perlu Perbaikan</option>
        </select>
        <input type="text" id="catatan" placeholder="Catatan (opsional)">
        <button type="submit">Simpan Setoran</button>
      </form>
    </section>
    <hr class="section-divider" />
    <section>
      <h2>Riwayat Setoran Hafalan</h2>
      <div class="filters">
        <select id="filter-nama"><option value="">Semua Siswa</option></select>
        <select id="filter-kelas"><option value="">Semua Kelas</option></select>
      </div>
      <table id="tabel-riwayat">
        <thead>
          <tr>
            <th>Nama Siswa</th>
            <th>Kelas</th>
            <th>Tanggal</th>
            <th>Surat</th>
            <th>Dari</th>
            <th>Sampai</th>
            <th>Status</th>
            <th>Catatan & Progress Total</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="btn-group-riwayat">
        <button id="reset-data">Reset Semua Data</button>
        <button id="btn-export" type="button" class="btn-primary" style="background:#4dd29f;">Export Data</button>
        <button id="btn-import" type="button" class="btn-primary" style="background:#e07e2d;">Import Data</button>
        <button id="btn-laporan-wali" type="button" class="btn-primary" style="background:#f4b400;">Laporan untuk Wali Murid</button>
      </div>
      <div id="modal-laporan" class="modal-bg">
        <div class="modal-content" style="max-width:500px">
          <h2>Laporan Hafalan Siswa</h2>
          <div id="laporan-wali-isi" style="max-height:400px;overflow-y:auto;font-size:1em;"></div>
          <div style="display:flex;gap:8px;margin-top:10px;">
            <button type="button" id="btn-salin-laporan" class="btn-primary" style="font-size:1em;">Salin Laporan</button>
            <button type="button" id="btn-tutup-laporan" class="btn-batal" style="font-size:1em;">Tutup</button>
          </div>
        </div>
      </div>
    </section>
    <hr class="section-divider" />
    <section>
      <h2>Grafik Perubahan Progress Hafalan per Siswa</h2>
      <button id="btn-print-chart" type="button" class="btn-primary" style="margin-bottom:12px;background:#8bc34a;">Cetak Grafik</button>
      <canvas id="chartProgres"></canvas>
    </section>
  </div>
  <script src="main.js"></script>
</body>
</html>
